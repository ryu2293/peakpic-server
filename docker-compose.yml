version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: caestro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: caestro1234
      MYSQL_DATABASE: caestro
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.0
    container_name: caestro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data: